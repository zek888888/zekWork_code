<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>战颅将军 - 模拟盘交易记录</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0f1419; color: #e0e0e0; font-family: 'Segoe UI', system-ui; }
        .card { background: #1a1f2e; border-radius: 12px; padding: 1.5rem; border: 1px solid #2a3441; }
        .stat-card { background: linear-gradient(135deg, #1a1f2e 0%, #242b3d 100%); }
        .profit { color: #00d084; }
        .loss { color: #ff4757; }
        .neutral { color: #a0a0a0; }
        .btn { background: #3b82f6; padding: 0.5rem 1rem; border-radius: 6px; color: white; cursor: pointer; }
        .btn:hover { background: #2563eb; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #2a3441; }
        th { color: #8892a0; font-weight: 500; }
        .badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; }
        .badge-long { background: #00d08420; color: #00d084; }
        .badge-short { background: #ff475720; color: #ff4757; }
        .loading { text-align: center; padding: 2rem; color: #8892a0; }
        .refresh-btn { position: fixed; bottom: 2rem; right: 2rem; z-index: 100; }
    </style>
</head>
<body>
    <div class="min-h-screen p-6">
        <!-- 头部 -->
        <header class="mb-8">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-gradient-to-br from-red-500 to-orange-500 rounded-xl flex items-center justify-center">
                        <i class="fas fa-skull text-2xl text-white"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold">战颅将军</h1>
                        <p class="text-gray-400">模拟盘交易记录 | 5分钟级别 | 启动资金 10000 USDT</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                    <span class="text-green-500">运行中</span>
                </div>
            </div>
        </header>

        <!-- 统计卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="card stat-card">
                <div class="text-gray-400 text-sm mb-1">当前资金</div>
                <div class="text-2xl font-bold" id="current-balance">--</div>
                <div class="text-sm mt-1" id="total-return">--</div>
            </div>
            <div class="card stat-card">
                <div class="text-gray-400 text-sm mb-1">总交易数</div>
                <div class="text-2xl font-bold" id="total-trades">--</div>
                <div class="text-sm mt-1">
                    <span class="profit" id="win-trades">--</span> 胜 / 
                    <span class="loss" id="loss-trades">--</span> 负
                </div>
            </div>
            <div class="card stat-card">
                <div class="text-gray-400 text-sm mb-1">胜率</div>
                <div class="text-2xl font-bold" id="win-rate">--</div>
                <div class="text-sm mt-1 text-gray-400">目标: 70%+</div>
            </div>
            <div class="card stat-card">
                <div class="text-gray-400 text-sm mb-1">总盈亏</div>
                <div class="text-2xl font-bold" id="total-pnl">--</div>
                <div class="text-sm mt-1" id="avg-pnl">--</div>
            </div>
        </div>

        <!-- 资金曲线 -->
        <div class="card mb-6">
            <h3 class="text-lg font-semibold mb-4">📈 资金曲线</h3>
            <canvas id="equityChart" height="100"></canvas>
        </div>

        <!-- 持仓表格 -->
        <div class="card mb-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold">🎯 当前持仓</h3>
                <span class="text-sm text-gray-400" id="open-positions-count">0 个持仓</span>
            </div>
            <div id="open-positions" class="loading">加载中...</div>
        </div>

        <!-- 历史交易 -->
        <div class="card">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold">📋 历史交易</h3>
                <div class="flex gap-2">
                    <button class="btn" onclick="loadHistory('all')">全部</button>
                    <button class="btn" onclick="loadHistory('closed')">已平仓</button>
                </div>
            </div>
            <div id="trade-history">
                <table>
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>交易对</th>
                            <th>方向</th>
                            <th>入场价</th>
                            <th>出场价</th>
                            <th>杠杆</th>
                            <th>盈亏</th>
                            <th>原因</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr><td colspan="8" class="loading">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 刷新按钮 -->
    <button class="refresh-btn btn" onclick="refreshAll()">
        <i class="fas fa-sync-alt mr-2"></i>刷新
    </button>

    <script>
        // 加载统计数据
        async function loadStats() {
            try {
                const res = await fetch('/api/trade/stats');
                const data = await res.json();
                
                if (data.success) {
                    const s = data.data;
                    document.getElementById('current-balance').textContent = s.current_balance.toLocaleString('en-US', {style: 'currency', currency: 'USD'});
                    document.getElementById('total-trades').textContent = s.total_trades;
                    document.getElementById('win-trades').textContent = s.win_trades + ' 胜';
                    document.getElementById('loss-trades').textContent = s.loss_trades + ' 负';
                    document.getElementById('win-rate').textContent = s.win_rate.toFixed(1) + '%';
                    document.getElementById('win-rate').className = s.win_rate >= 70 ? 'text-2xl font-bold profit' : 'text-2xl font-bold';
                    document.getElementById('total-pnl').textContent = (s.total_pnl >= 0 ? '+' : '') + s.total_pnl.toFixed(2) + ' USDT';
                    document.getElementById('total-pnl').className = 'text-2xl font-bold ' + (s.total_pnl >= 0 ? 'profit' : 'loss');
                    document.getElementById('avg-pnl').textContent = '平均 ' + (s.avg_pnl >= 0 ? '+' : '') + s.avg_pnl.toFixed(2) + ' USDT';
                    document.getElementById('total-return').textContent = s.return_percent >= 0 ? '+' + s.return_percent.toFixed(2) + '%' : s.return_percent.toFixed(2) + '%';
                    document.getElementById('total-return').className = 'text-sm mt-1 ' + (s.return_percent >= 0 ? 'profit' : 'loss');
                    document.getElementById('open-positions-count').textContent = s.open_positions + ' 个持仓';
                }
            } catch (err) {
                console.error('加载统计失败:', err);
            }
        }

        // 加载持仓
        async function loadPositions() {
            try {
                const res = await fetch('/api/trade/history?status=open');
                const data = await res.json();
                
                const container = document.getElementById('open-positions');
                
                if (!data.success || !data.data.length) {
                    container.innerHTML = '<div class="text-center text-gray-400 py-8">暂无持仓</div>';
                    return;
                }
                
                let html = '<table><thead><tr>' +
                    '<th>时间</th><th>交易对</th><th>方向</th><th>入场价</th><th>杠杆</th><th>保证金</th><th>止损/止盈</th>' +
                    '</tr></thead><tbody>';
                
                data.data.forEach(t => {
                    html += `<tr>
                        <td>${new Date(t.entry_time).toLocaleString('zh-CN')}</td>
                        <td>${t.symbol}</td>
                        <td><span class="badge badge-${t.direction}">${t.direction.toUpperCase()}</span></td>
                        <td>${t.entry_price}</td>
                        <td>${t.leverage}x</td>
                        <td>${t.margin.toFixed(2)} USDT</td>
                        <td>${t.stop_loss} / ${t.take_profit.join(', ')}</td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (err) {
                document.getElementById('open-positions').innerHTML = '<div class="text-center text-red-500">加载失败</div>';
            }
        }

        // 加载历史
        async function loadHistory(status = 'all') {
            try {
                const res = await fetch(`/api/trade/history?status=${status}&limit=50`);
                const data = await res.json();
                
                const tbody = document.getElementById('history-tbody');
                
                if (!data.success || !data.data.length) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-gray-400 py-8">暂无交易记录</td></tr>';
                    return;
                }
                
                tbody.innerHTML = data.data.map(t => {
                    const pnlClass = t.pnl > 0 ? 'profit' : t.pnl < 0 ? 'loss' : 'neutral';
                    const pnlText = t.pnl !== null ? (t.pnl >= 0 ? '+' : '') + t.pnl.toFixed(2) + ' (' + t.pnl_percent.toFixed(2) + '%)' : '-';
                    return `<tr>
                        <td>${new Date(t.entry_time).toLocaleString('zh-CN')}</td>
                        <td>${t.symbol}</td>
                        <td><span class="badge badge-${t.direction}">${t.direction.toUpperCase()}</span></td>
                        <td>${t.entry_price}</td>
                        <td>${t.exit_price || '-'}</td>
                        <td>${t.leverage}x</td>
                        <td class="${pnlClass}">${pnlText}</td>
                        <td>${t.exit_reason || '-'}</td>
                    </tr>`;
                }).join('');
            } catch (err) {
                document.getElementById('history-tbody').innerHTML = '<tr><td colspan="8" class="text-center text-red-500">加载失败</td></tr>';
            }
        }

        // 加载资金曲线
        async function loadEquity() {
            try {
                const res = await fetch('/api/trade/equity');
                const data = await res.json();
                
                if (data.success && data.data.length > 0) {
                    const labels = data.data.map(d => new Date(d.timestamp).toLocaleDateString('zh-CN'));
                    const balances = data.data.map(d => d.balance);
                    
                    new Chart(document.getElementById('equityChart'), {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: '资金余额 (USDT)',
                                data: balances,
                                borderColor: '#3b82f6',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false }
                            },
                            scales: {
                                y: {
                                    beginAtZero: false,
                                    grid: { color: '#2a3441' },
                                    ticks: { color: '#8892a0' }
                                },
                                x: {
                                    grid: { color: '#2a3441' },
                                    ticks: { color: '#8892a0' }
                                }
                            }
                        }
                    });
                }
            } catch (err) {
                console.error('加载资金曲线失败:', err);
            }
        }

        // 刷新所有
        function refreshAll() {
            loadStats();
            loadPositions();
            loadHistory();
            loadEquity();
        }

        // 初始化
        refreshAll();
        
        // 自动刷新
        setInterval(refreshAll, 30000);  // 每30秒刷新
    </script>
</body>
</html>
