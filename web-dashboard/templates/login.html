{% extends "base.html" %}

{% block title %}登录 - 量化交易系统{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <div class="text-center mb-4">
            <i class="bi bi-graph-up-arrow login-icon"></i>
            <h2 class="mt-3">量化交易系统</h2>
            <p class="text-muted">Quantitative Trading System</p>
        </div>
        
        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label for="username" class="form-label">
                    <i class="bi bi-person"></i> 用户名
                </label>
                <input type="text" class="form-control form-control-lg" id="username" name="username" 
                       placeholder="请输入用户名" required autofocus>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label">
                    <i class="bi bi-lock"></i> 密码
                </label>
                <input type="password" class="form-control form-control-lg" id="password" name="password" 
                       placeholder="请输入密码" required>
            </div>
            
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="remember" name="remember">
                <label class="form-check-label" for="remember">记住我</label>
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg w-100">
                <i class="bi bi-box-arrow-in-right"></i> 登录
            </button>
        </form>
        
        <div class="mt-4 text-center text-muted">
            <small>默认账号: admin / admin123</small>
        </div>
    </div>
</div>
{% endblock %}
