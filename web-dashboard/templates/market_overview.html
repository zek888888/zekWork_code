{% extends "base.html" %}

{% block title %}市场信息总览 - 量化交易系统{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/card.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/badge.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/button.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/components/tabs.css') }}">
<style>
.market-overview {
    padding: 12px;
    font-size: 12px;
}

.section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
}

.section-title h2 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
}

.section-title .icon {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
}

.section-title.news .icon { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.section-title.crypto .icon { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
.section-title.sector .icon { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
.section-title.meme .icon { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
.section-title.wallet .icon { background: linear-gradient(135deg, #30cfd0 0%, #330867 100%); }

/* 紧凑卡片 */
.card {
    margin-bottom: 10px;
}

.card-header {
    padding: 8px 12px;
}

.card-body {
    padding: 10px;
}

/* 新闻卡片 */
.news-card {
    border-left: 2px solid var(--border-color);
    transition: all 0.2s ease;
    padding: 8px;
    margin-bottom: 6px;
}

.news-card:hover {
    border-left-color: var(--primary-color);
    background: rgba(255, 255, 255, 0.02);
}

.news-card.positive { border-left-color: #00d084; }
.news-card.negative { border-left-color: #ef4444; }
.news-card.neutral { border-left-color: #64748b; }

.news-title {
    font-weight: 500;
    line-height: 1.4;
    margin-bottom: 4px;
    font-size: 12px;
}

.news-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: var(--text-muted);
}

.news-source {
    display: flex;
    align-items: center;
    gap: 4px;
}

.news-sentiment {
    display: flex;
    align-items: center;
    gap: 2px;
}

.news-keywords {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 4px;
}

.news-keywords .badge {
    font-size: 9px;
    padding: 2px 6px;
}

/* 币种卡片 */
.token-card {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.02);
    transition: all 0.2s ease;
    margin-bottom: 4px;
}

.token-card:hover {
    background: rgba(255, 255, 255, 0.05);
}

.token-rank {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    background: var(--tag-background);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 10px;
}

.token-rank.top3 {
    background: linear-gradient(135deg, #ffd700 0%, #ffaa00 100%);
    color: #000;
}

.token-icon {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--tag-background);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
}

.token-info {
    flex: 1;
}

.token-name {
    font-weight: 600;
    font-size: 11px;
    margin-bottom: 0;
}

.token-symbol {
    font-size: 9px;
    color: var(--text-muted);
}

.token-price {
    text-align: right;
}

.token-price-value {
    font-weight: 600;
    font-size: 11px;
}

.token-price-change {
    font-size: 10px;
}

/* 板块卡片 */
.sector-card {
    background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
    border: 1px solid var(--border-color);
}

.sector-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border-color);
}

.sector-name {
    font-weight: 600;
    font-size: 11px;
}

.sector-change {
    font-weight: 600;
    font-size: 11px;
}

.sector-leaders {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.leader-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 4px;
}

.leader-info {
    display: flex;
    align-items: center;
    gap: 6px;
}

.leader-rank {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    background: var(--tag-background);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    font-weight: 600;
}

.leader-name {
    font-weight: 500;
    font-size: 10px;
}

.leader-code {
    font-size: 9px;
    color: var(--text-muted);
}

.leader-change {
    font-size: 10px;
}

/* 聪明钱包 */
.wallet-form {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
}

.wallet-form input {
    flex: 1;
    padding: 6px 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    color: var(--text-primary);
    font-size: 11px;
}

.wallet-form input:focus {
    outline: none;
    border-color: var(--primary-color);
}

.wallet-form input::placeholder {
    color: var(--text-muted);
    font-size: 10px;
}

.wallet-form button {
    padding: 6px 10px;
    font-size: 12px;
}

.wallet-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.wallet-item {
    background: rgba(255, 255, 255, 0.03);
    border-radius: 8px;
    padding: 8px;
}

.wallet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
}

.wallet-address {
    font-family: monospace;
    font-size: 10px;
    color: var(--text-secondary);
}

.wallet-total {
    font-weight: 600;
    color: var(--primary-color);
    font-size: 11px;
}

.wallet-holdings {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.holding-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 3px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.holding-item:last-child {
    border-bottom: none;
}

.holding-token {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
}

.holding-amount {
    text-align: right;
    font-size: 10px;
}

.holding-amount small {
    font-size: 9px;
}

/* 刷新按钮 */
.refresh-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    color: var(--text-secondary);
    font-size: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.refresh-btn:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: var(--primary-color);
}

.refresh-btn.spinning i {
    animation: spin 1s linear infinite;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* 图表容器 */
.chart-container {
    height: 180px;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 8px;
    padding: 8px;
}

/* 时间周期选择器 */
.time-selector {
    display: flex;
    gap: 4px;
}

.time-btn {
    padding: 3px 8px;
    background: transparent;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    color: var(--text-muted);
    font-size: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.time-btn:hover,
.time-btn.active {
    background: var(--primary-color);
    border-color: var(--primary-color);
    color: #000;
}

/* 页面标题 */
.page-header {
    margin-bottom: 12px;
}

.page-header h1 {
    font-size: 16px;
    margin: 0;
}

.last-update {
    font-size: 10px;
    color: var(--text-muted);
}

/* BTC价格显示 */
.btc-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}

.btc-price-main {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
}

.btc-label {
    font-size: 10px;
    color: var(--text-muted);
}

.btc-change-badge {
    font-size: 11px;
}

/* 网格布局 - 一页展示 */
.overview-grid {
    display: grid;
    grid-template-columns: 1fr 1.3fr 0.9fr;
    gap: 10px;
}

.overview-grid .column {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* 响应式 */
@media (max-width: 1200px) {
    .overview-grid {
        grid-template-columns: 1fr 1fr;
    }
    .overview-grid .column:last-child {
        grid-column: 1 / -1;
        flex-direction: row;
    }
}

@media (max-width: 768px) {
    .overview-grid {
        grid-template-columns: 1fr;
    }
    .overview-grid .column:last-child {
        flex-direction: column;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="market-overview">
    <!-- 页面标题 -->
    <div class="page-header d-flex justify-content-between align-items-center">
        <div class="section-title">
            <div class="icon" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                <i class="ti ti-dashboard"></i>
            </div>
            <h1>市场信息总览</h1>
        </div>
        <div class="d-flex gap-2 align-items-center">
            <span class="last-update" id="lastUpdate">最后更新: --:--:--</span>
            <button class="refresh-btn" onclick="refreshAllData()">
                <i class="ti ti-refresh"></i> 刷新
            </button>
        </div>
    </div>

    <div class="overview-grid">
        <!-- 左侧列：新闻 + 土狗 -->
        <div class="column">
            <!-- 新闻聚焦 -->
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div class="section-title news mb-0">
                        <div class="icon"><i class="ti ti-news"></i></div>
                        <h2>新闻聚焦</h2>
                    </div>
                    <button class="refresh-btn" onclick="refreshNews()">
                        <i class="ti ti-refresh"></i>
                    </button>
                </div>
                <div class="card-body" id="newsContainer">
                    <div class="text-center py-3 text-muted">
                        <i class="ti ti-loader-2 ti-spin" style="font-size: 16px;"></i>
                        <p class="mt-1 mb-0" style="font-size: 10px;">加载中...</p>
                    </div>
                </div>
            </div>

            <!-- 热点土狗 -->
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div class="section-title meme mb-0">
                        <div class="icon"><i class="ti ti-flame"></i></div>
                        <h2>热点土狗</h2>
                    </div>
                    <div class="d-flex gap-1">
                        <a href="https://gmgn.ai/" target="_blank" class="refresh-btn">
                            <i class="ti ti-external-link"></i>
                        </a>
                        <button class="refresh-btn" onclick="refreshMemeCoins()">
                            <i class="ti ti-refresh"></i>
                        </button>
                    </div>
                </div>
                <div class="card-body p-2" id="memeContainer">
                    <div class="text-center py-3 text-muted">
                        <i class="ti ti-loader-2 ti-spin" style="font-size: 16px;"></i>
                        <p class="mt-1 mb-0" style="font-size: 10px;">加载中...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 中间列：虚拟货币大盘 + 板块追踪 -->
        <div class="column">
            <!-- 虚拟货币大盘 -->
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div class="section-title crypto mb-0">
                        <div class="icon"><i class="ti ti-coin-bitcoin"></i></div>
                        <h2>虚拟货币大盘</h2>
                    </div>
                    <div class="time-selector">
                        <button class="time-btn active" data-interval="15m">15分</button>
                        <button class="time-btn" data-interval="1h">1h</button>
                        <button class="time-btn" data-interval="4h">4h</button>
                        <button class="time-btn" data-interval="1d">1d</button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="btc-header">
                        <div>
                            <span class="btc-label">BTC/USDT</span>
                            <h3 class="btc-price-main" id="btcPrice">--</h3>
                        </div>
                        <div class="text-end">
                            <span class="badge btc-change-badge" id="btcChange">--</span>
                            <p class="btc-label mb-0 mt-1">24h涨跌</p>
                        </div>
                    </div>
                    <div id="btcChart" class="chart-container"></div>
                </div>
            </div>

            <!-- 板块追踪 -->
            <div class="card">
                <div class="card-header">
                    <div class="section-title sector mb-0">
                        <div class="icon"><i class="ti ti-chart-bar"></i></div>
                        <h2>板块追踪</h2>
                    </div>
                </div>
                <div class="card-body" id="sectorContainer">
                    <div class="text-center py-3 text-muted">
                        <i class="ti ti-loader-2 ti-spin" style="font-size: 16px;"></i>
                        <p class="mt-1 mb-0" style="font-size: 10px;">加载中...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧列：聪明钱包 -->
        <div class="column">
            <!-- 聪明钱包持仓 -->
            <div class="card">
                <div class="card-header">
                    <div class="section-title wallet mb-0">
                        <div class="icon"><i class="ti ti-wallet"></i></div>
                        <h2>聪明钱包持仓</h2>
                    </div>
                </div>
                <div class="card-body">
                    <div class="wallet-form">
                        <input type="text" id="walletAddress" placeholder="输入钱包地址 (0x...)" maxlength="42">
                        <button class="btn btn-primary" onclick="addWallet()">
                            <i class="ti ti-plus"></i>
                        </button>
                    </div>
                    <div id="walletContainer">
                        <div class="text-center py-3 text-muted">
                            <p class="mb-0" style="font-size: 11px;">暂无追踪的钱包</p>
                            <small style="font-size: 9px;">添加钱包地址开始追踪</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
