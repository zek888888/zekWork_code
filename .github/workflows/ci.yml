name: CI - Quant Trading System

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        # 检查语法错误和未定义变量
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # 检查代码风格 (最大行长度127，忽略一些警告)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test with pytest
      run: |
        pytest tests/ -v --tb=short || echo "Tests not implemented yet"
      continue-on-error: true
    
    - name: Test data layer imports
      run: |
        python -c "from data_layer.market_data_fetch.fetch import init_database; print('✓ Market data fetch OK')"
        python -c "from data_layer.gmgn_fetch.gmgn_fetch import GMGNFetcher; print('✓ GMGN fetch OK')"
      continue-on-error: true
    
    - name: Test research layer imports
      run: |
        python -c "from research_layer.factor_score_engine.score import calculate_factor_score; print('✓ Factor score OK')"
      continue-on-error: true
    
    - name: Test execution layer imports
      run: |
        python -c "from execution_layer.trade_executor.trade_executor import TradeExecutor; print('✓ Trade executor OK')"
        python -c "from execution_layer.trade_executor.exchange_api import BinanceAPI; print('✓ Exchange API OK')"
      continue-on-error: true
    
    - name: Test backtest engine
      run: |
        python -c "from backtest.backtest_engine import BacktestEngine; print('✓ Backtest engine OK')"
      continue-on-error: true
    
    - name: Test AI knowledge base
      run: |
        python -c "from ai_models.knowledge_base.knowledge_manager import KnowledgeBaseManager; print('✓ Knowledge base OK')"
      continue-on-error: true
    
    - name: Test main module imports
      run: |
        python -c "import sys; sys.path.insert(0, '.'); from main import QuantTradingSystem; print('✓ Main module OK')"
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Run safety check
      run: |
        pip install safety
        safety check || echo "Safety check completed"
      continue-on-error: true

  notify:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: always()
    steps:
    - name: Notify on success
      if: needs.test.result == 'success' && needs.security.result == 'success'
      run: |
        echo "✅ CI passed successfully!"
    
    - name: Notify on failure
      if: needs.test.result == 'failure' || needs.security.result == 'failure'
      run: |
        echo "❌ CI failed. Please check the logs."
